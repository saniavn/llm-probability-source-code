<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AI Learning</title>
    <style>
      /* General Page Styles */
      body {
        font-family: "Comic Sans MS", cursive, sans-serif;
        background-color: #d1f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        margin: 0;
      }

      /* Container Styling */
      .container {
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        background-color: #ffd685;
        width: 45%;
        min-width: 300px;
        max-width: 650px;
        margin-top: 0;
      }

      h2 {
        color: black;
        margin-bottom: 10px;
      }

      /* Fun Fact / Privacy Section */
      .fun-fact {
        background: #f0f8ff;
        padding: 12px;
        border-radius: 6px;
        font-size: 20px;
        color: black;
        margin-bottom: 15px;
        text-align: left;
      }

      button {
        width: 150px;
        padding: 8px 12px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
        display: block;
        margin: 10px auto;
      }

      button:hover {
        background-color: #0056b3;
      }

      .page-title {
        font-size: 48px;
        font-weight: bold;
        color: Black;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 10px;
        width: 450px;
        position: absolute;
        top: 2%;
        left: 50%;
        transform: translateX(-50%);
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        .page-title {
          font-size: 28px;
          width: 80%;
          top: 2%;
        }

        h2 {
          font-size: 20px;
        }

        .fun-fact {
          font-size: 16px;
        }

        button {
          font-size: 16px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <img
      src="{{ url_for('static', filename='images/Gemini01.png') }}"
      alt="Gemini Logo"
      class="page-title"
    />

    <div class="container">
      <h2>
        Welcome to Think Like
        <img
          src="{{ url_for('static', filename='images/ChatGPT1.png') }}"
          alt="AI"
          style="vertical-align: middle; width: 50px; height: auto"
        />!
      </h2>

      <div class="fun-fact">
        <p><b>Privacy Note</b></p>
        <p>
          This educational web app does not collect, store, or share any data
          from users. We do not require accounts, and we do not ask users to
          provide personal data to use the app. The app is intended for learning
          purposes only.
        </p>
      </div>

      <!-- Redirects the user to the auto_login route in app.py -->
      <a href="/auto_login" style="text-decoration: none">
        <button type="button" id="lets-play-btn">Let's Play</button>
      </a>
    </div>
  </body>
</html>
